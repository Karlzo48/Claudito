<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9306f">
<title>Mon tableau de bord</title>
<style>
  :root{
    --bg:#fdf0f5; --card:#ffffff; --ink:#2a1820; --muted:#7a5a68;
    --line:#f5d3e1; --accent:#c9306f; --accent-ink:#ffffff; --danger:#b42318;
    --shadow:0 1px 3px rgba(201,48,111,.08),0 8px 24px rgba(201,48,111,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1216; --card:#251a20; --ink:#f3e6ec; --muted:#b89aa8;
      --line:#3d2a33; --accent:#f06aa6; --accent-ink:#1a1216; --danger:#ff7a6b;
      --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:clamp(16px,4vw,40px);
  }
  .wrap{max-width:900px;margin:0 auto}
  header{margin-bottom:28px}
  h1{font-size:clamp(22px,5vw,30px);margin:0 0 4px;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:15px}
  section{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:clamp(16px,3vw,24px);margin-bottom:22px;box-shadow:var(--shadow);
  }
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  h2{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .link{
    position:relative;display:flex;flex-direction:column;gap:3px;
    padding:14px 14px;border:1px solid var(--line);border-radius:12px;
    text-decoration:none;color:var(--ink);background:transparent;
    transition:border-color .15s,transform .05s;
  }
  .link:hover{border-color:var(--accent)}
  .link:active{transform:scale(.99)}
  .link .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link .host{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link .del{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border:none;border-radius:50%;
    background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;
    opacity:0;transition:opacity .15s;
  }
  .link:hover .del,.link:focus-within .del{opacity:1}
  .link .del:hover{color:var(--danger)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}
  .btn{
    border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--accent);color:var(--accent-ink);
  }
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .form{display:none;gap:10px;margin-top:14px;flex-wrap:wrap}
  .form.open{display:flex}
  .form input{
    flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:15px;
  }
  .form input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  textarea{
    width:100%;min-height:200px;resize:vertical;padding:14px;border:1px solid var(--line);
    border-radius:12px;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    font-family:inherit;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .saved{color:var(--muted);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mon tableau de bord</h1>
    <div class="date" id="date"></div>
  </header>

  <section>
    <div class="sec-head">
      <h2>Liens rapides</h2>
      <button class="btn ghost" id="toggleForm">+ Ajouter</button>
    </div>
    <div class="links" id="links"></div>
    <div class="form" id="form">
      <input id="linkName" type="text" placeholder="Nom (ex. LeanIX)" autocomplete="off">
      <input id="linkUrl" type="url" placeholder="https://…" autocomplete="off">
      <button class="btn" id="addLink">Enregistrer</button>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Notes</h2>
      <span class="saved" id="saved"></span>
    </div>
    <textarea id="notes" placeholder="Tes notes restent ici, même après fermeture…"></textarea>
  </section>
</div>

<script>
(function(){
  "use strict";
  var LINKS_KEY="dashboard.links.v1", NOTES_KEY="dashboard.notes.v1";

  // --- Date du jour ---
  var d=new Date();
  document.getElementById("date").textContent=
    d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  // --- Stockage sûr (localStorage peut échouer en navigation privée) ---
  function load(key,fallback){
    try{var v=localStorage.getItem(key);return v==null?fallback:JSON.parse(v);}
    catch(e){return fallback;}
  }
  function save(key,val){
    try{localStorage.setItem(key,JSON.stringify(val));return true;}
    catch(e){return false;}
  }

  // --- Liens ---
  var links=load(LINKS_KEY,[]);
  var linksEl=document.getElementById("links");

  function hostOf(url){
    try{return new URL(url).hostname.replace(/^www\./,"");}catch(e){return url;}
  }
  function renderLinks(){
    linksEl.innerHTML="";
    if(!links.length){
      var p=document.createElement("div");
      p.className="empty";
      p.textContent="Aucun lien pour l'instant. Clique sur « + Ajouter ».";
      linksEl.appendChild(p);
      return;
    }
    links.forEach(function(l,i){
      var a=document.createElement("a");
      a.className="link";a.href=l.url;a.target="_blank";a.rel="noopener";
      var name=document.createElement("span");name.className="name";name.textContent=l.name;
      var host=document.createElement("span");host.className="host";host.textContent=hostOf(l.url);
      var del=document.createElement("button");
      del.className="del";del.type="button";del.textContent="×";
      del.setAttribute("aria-label","Supprimer "+l.name);
      del.addEventListener("click",function(ev){
        ev.preventDefault();ev.stopPropagation();
        links.splice(i,1);save(LINKS_KEY,links);renderLinks();
      });
      a.appendChild(del);a.appendChild(name);a.appendChild(host);
      linksEl.appendChild(a);
    });
  }

  var form=document.getElementById("form");
  var nameIn=document.getElementById("linkName");
  var urlIn=document.getElementById("linkUrl");
  document.getElementById("toggleForm").addEventListener("click",function(){
    form.classList.toggle("open");
    if(form.classList.contains("open"))nameIn.focus();
  });
  function addLink(){
    var name=nameIn.value.trim();
    var url=urlIn.value.trim();
    if(!name||!url)return;
    if(!/^https?:\/\//i.test(url))url="https://"+url;
    links.push({name:name,url:url});
    save(LINKS_KEY,links);
    nameIn.value="";urlIn.value="";nameIn.focus();
    renderLinks();
  }
  document.getElementById("addLink").addEventListener("click",addLink);
  urlIn.addEventListener("keydown",function(e){if(e.key==="Enter")addLink();});

  renderLinks();

  // --- Notes (sauvegarde auto) ---
  var notes=document.getElementById("notes");
  var savedEl=document.getElementById("saved");
  notes.value=load(NOTES_KEY,"");
  var t=null;
  notes.addEventListener("input",function(){
    savedEl.textContent="…";
    if(t)clearTimeout(t);
    t=setTimeout(function(){
      var ok=save(NOTES_KEY,notes.value);
      savedEl.textContent=ok?"Enregistré ✓":"Non enregistré (stockage bloqué)";
      setTimeout(function(){savedEl.textContent="";},1800);
    },500);
  });
})();
</script>
</body>
</html>
